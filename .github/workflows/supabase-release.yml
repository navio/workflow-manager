name: Supabase Release

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - "package.json"
      - "bun.lockb"
      - ".github/workflows/supabase-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-release-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_ID"

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push database migrations
        run: supabase db push

      - name: Deploy edge functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: Re-deploy public edge functions without JWT verification
        run: |
          supabase functions deploy search-workflows --project-ref "$SUPABASE_PROJECT_ID" --use-api --no-verify-jwt
          supabase functions deploy pull-workflow --project-ref "$SUPABASE_PROJECT_ID" --use-api --no-verify-jwt
