name: Supabase Release

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - "package.json"
      - "bun.lockb"
      - ".github/workflows/supabase-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-release-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase secrets
        run: |
          missing=0

          for secret_name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!secret_name}" ]; then
              echo "::error title=Missing GitHub secret::Repository secret ${secret_name} is not configured. Add it in Settings > Secrets and variables > Actions."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Supabase release is blocked until all required GitHub Actions secrets are configured."
            exit 1
          fi

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push database migrations
        run: supabase db push

      - name: Deploy edge functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api
