<!doctype html>
<html>
  <body style="margin:0;padding:24px;background:#f5f7f6;font-family:Arial,sans-serif;color:#0f172a;">
    <div style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #dce3df;border-radius:12px;padding:24px;">
      <p style="margin:0 0 8px;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#6b7280;">workflow-manager registry</p>
      <h1 style="margin:0 0 12px;font-size:26px;line-height:1.25;color:#111827;">Reset your password</h1>
      <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#1f2937;">
        Use this link to set a new password for your account.
      </p>
      <p style="margin:0 0 20px;">
        <a
          href="{{ .SiteURL }}/auth/reset/confirm?token_hash={{ .TokenHash }}&type=recovery"
          style="display:inline-block;background:#b6ff5c;color:#0b0d0c;text-decoration:none;font-weight:700;padding:12px 16px;border-radius:9px;"
          >Reset password</a
        >
      </p>
      <p style="margin:0 0 10px;font-size:14px;line-height:1.6;color:#374151;">Or enter this one-time code:</p>
      <p style="margin:0 0 20px;font-size:28px;font-weight:700;letter-spacing:0.14em;color:#111827;">{{ .Token }}</p>
      <p style="margin:0;font-size:12px;line-height:1.5;color:#6b7280;">If you did not request a reset, you can ignore this email.</p>
    </div>
  </body>
</html>
